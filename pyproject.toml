[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-gui"
description = "Unofficial Linux GUI (system tray + window) for the Cloudflare WARP client (warp-cli)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sarthak-Awasthi", email = "bengdeeba@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["PyQt5>=5.15"]
keywords = ["cloudflare", "warp", "vpn", "dns", "proxy", "gui", "qt", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Sarthak-Awasthi/warp-gui"
Repository = "https://github.com/Sarthak-Awasthi/warp-gui"
Issues = "https://github.com/Sarthak-Awasthi/warp-gui/issues"

# A GUI launcher named `warp-gui` on the PATH (installed to <prefix>/bin).
[project.gui-scripts]
warp-gui = "warp_gui.app:main"

[tool.setuptools]
packages = ["warp_gui"]

[tool.setuptools.dynamic]
version = { attr = "warp_gui.__version__" }

# Desktop entry + icon installed under the data prefix (…/share/…).
[tool.setuptools.data-files]
"share/applications" = ["packaging/warp-gui.desktop"]
"share/icons/hicolor/scalable/apps" = ["assets/warp-gui.svg"]
"share/icons/hicolor/256x256/apps" = ["assets/warp-gui.png"]
"share/metainfo" = ["packaging/io.github.sarthak_awasthi.warp_gui.metainfo.xml"]
